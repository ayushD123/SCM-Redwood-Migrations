<script>
async function updatePhaseInSheet(customerName, username, phase) {
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKS57F-eFM0ysSVMIloUjkJ6f6ryXPIGhi9xF1ogVUZ7o-YdHSSJ7QBhgqaTKBc3rMaA/exec";

  // console.log("script");

  await fetch(WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    body: new URLSearchParams({
      customerName,
      username,
      phase
    }),
  });

  // console.log("request sent");
}

async function getSessionInfo() {
  const response = await fetch("/api/session-info", {
    method: "GET",
    credentials: "include"
  });

  if (!response.ok) {
    throw new Error("Failed to fetch session info");
  }

  const data = await response.json();
  return data; 
}
function safeFileName(name) {
  return String(name).replace(/[\/\\:*?"<>|]+/g, "_").trim();
}

/* Resolve customer name for download naming (session API -> sessionStorage -> default) */
let cachedCustomerNameForFiles = "";
async function resolveCustomerNameForFiles() {
  if (cachedCustomerNameForFiles) return cachedCustomerNameForFiles;

  try {
    const session = await getSessionInfo();
    const fromSessionApi = (session?.customer || "").trim();
    if (fromSessionApi) {
      cachedCustomerNameForFiles = fromSessionApi;
      sessionStorage.setItem("customerName", fromSessionApi);
      return fromSessionApi;
    }
  } catch (e) {
    // fallback below
  }

  const fromStorage = (sessionStorage.getItem("customerName") || "").trim();
  cachedCustomerNameForFiles = fromStorage || "Customer";
  return cachedCustomerNameForFiles;
}

function makeProductKey(productName) {
  return safeFileName(productName).replace(/\s+/g, "_");
}

function round(v) { return Math.round(v); }

let modules = [];
let products = [];

function addModule() {
  let name = document.getElementById("moduleName").value;
  let f = parseFloat(moduleFeatures.value) || 0;
  let p = parseFloat(modulePersonalization.value) || 0;
  if (!name) return;
  modules.push({ name, f, p });
  renderModules();
}

function removeModule(i) {
  modules.splice(i, 1);
  renderModules();
}

function renderModules() {
  let table = document.getElementById("moduleTable");
  table.innerHTML = `
    <tr>
      <th>Module</th>
      <th>Features</th>
      <th>Personalization</th>
      <th>Action</th>
    </tr>`;
  modules.forEach((m, i) => {
    table.innerHTML += `
      <tr>
        <td>${m.name}</td>
        <td>${m.f}</td>
        <td>${m.p}</td>
        <td><button onclick="removeModule(${i})">Remove</button></td>
      </tr>`;
  });
}

function calculateCSU(f, p, includeDiscussion) {
  let discussion = includeDiscussion ? 12 : 0;
  let G11 = round(round(f * 0.1) / 2);
  let G12 = round(round(f * 0.2) / 2);
  let G13 = 8;
  let G19 = 12;
  let D9 = 4;
  let D13 = G11 + G12 + G13 + G19;
  let D14_15 = p ? 18 + p : 12;
  let D17 = 16;
  let D22 = round(round(f * 0.5) / 2);
  let D25 = 0;
  return {
    discussion,
    D9,
    D13,
    D14_15,
    D17,
    D22,
    D25,
    csu: discussion + D9 + D13 + D14_15 + D17 + D22
  };
}

function addProduct() {
  let product = productName.value.trim();
  let f = parseFloat(totalFeatures.value) || 0;
  let p = parseFloat(totalPersonalization.value) || 0;
  let complexity = parseFloat(document.getElementById("complexity").value) || 1;
  let includeDiscussion = document.getElementById("discussionCheck").checked;
  if (!product || modules.length === 0) return;

  let result = calculateCSU(f, p, includeDiscussion);
  let actual = round(result.csu * complexity);

  products.push({
    product,
    productKey: makeProductKey(product),
    modules: [...modules],
    totalFeatures: f,
    totalPersonalization: p,
    complexity,
    csu: result.csu,
    actual,
    includeDiscussion
  });

  modules = [];
  renderModules();
}

function generateSummary() {
  let table = document.getElementById("summaryTable");
  table.innerHTML = `
    <tr>
      <th>Product</th>
      <th>Module</th>
      <th>Features</th>
      <th>Personalization</th>
      <th>CSU</th>
    </tr>`;

  let grandF = 0, grandP = 0, grandCSU = 0, grandActual = 0;
  let complexitySum = 0;

  products.forEach(data => {
    grandF += data.totalFeatures;
    grandP += data.totalPersonalization;
    grandCSU += data.csu;
    grandActual += data.actual;
    complexitySum += data.complexity;

    let moduleCount = data.modules.length;

    data.modules.forEach((m, index) => {
      let row = '<tr class="sheet-row">';
      row += `<td>${data.product}</td>`;
      row += `<td>${m.name}</td>`;
      row += `<td>${m.f}</td>`;
      row += `<td>${m.p}</td>`;
      if (index === 0) row += `<td rowspan="${moduleCount}">${data.actual}</td>`;
      row += "</tr>";
      table.innerHTML += row;
    });

    table.innerHTML += `
      <tr class="product-total">
        <td colspan="2">Total - ${data.product}</td>
        <td>${data.totalFeatures}</td>
        <td>${data.totalPersonalization}</td>
        <td>${data.actual}</td>
      </tr>`;
  });

  let avgComplexity = products.length > 0 ? (complexitySum / products.length).toFixed(2) : 0;

  table.innerHTML += `
    <tr class="grand-total">
      <td colspan="2">Grand Total</td>
      <td>${grandF}</td>
      <td>${grandP}</td>
      <td>${grandActual}</td>
    </tr>`;
}

function copySheet(id) {
  const range = document.createRange();
  range.selectNode(document.getElementById(id));
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  document.execCommand("copy");
  window.getSelection().removeAllRanges();
  alert("Sheet copied!");
}

function copySummary() {
  const range = document.createRange();
  range.selectNode(document.getElementById("summaryTable"));
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  document.execCommand("copy");
  window.getSelection().removeAllRanges();
  alert("Summary copied!");
}
//downloading the indivial product excel sheet
async function downloadSheet(tableId) {
  const element = document.getElementById(tableId);
  if (!element) {
    alert("Sheet not found!");
    return;
  }

  const productKey = tableId.startsWith("sheet_") ? tableId.slice("sheet_".length) : tableId;
  const found = products.find(p => p.productKey === productKey);
  const productName = found ? found.product : productKey;

  const customer = await resolveCustomerNameForFiles();
  const workbook = XLSX.utils.table_to_book(element, { sheet: "Sheet1" });
  const fileName = safeFileName(`${customer}_${productName}`) + ".xlsx";
  XLSX.writeFile(workbook, fileName);
}
// downloading all the files and storing in single zip file
async function downloadAllAsZip() {
  if (!products.length) {
    alert("No products found to download.");
    return;
  }

  const customer = await resolveCustomerNameForFiles();
  const zip = new JSZip();

  for (const data of products) {
    const tableId = "sheet_" + data.productKey;
    const element = document.getElementById(tableId);
    if (!element) continue;

    const worksheet = XLSX.utils.table_to_sheet(element);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");

    const excelBuffer = XLSX.write(workbook, { bookType: "xlsx", type: "array" });
    const excelName = safeFileName(`${customer}_${data.product}`) + ".xlsx";
    zip.file(excelName, excelBuffer);
  }

  const zipBlob = await zip.generateAsync({ type: "blob" });
  const zipName = safeFileName(`${customer}_All_Products`) + ".zip";
  if (typeof saveAs === "function") {
    saveAs(zipBlob, zipName);
  } else {
    // Fallback if FileSaver is unavailable
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = zipName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
}

async function runPhase() {

  cachedCustomerNameForFiles = (customer || "").trim();

  updatePhaseInSheet(customer, user, "phase1");
}

runPhase();
