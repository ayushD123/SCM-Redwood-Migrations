<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCM Redwood Tool</title>

<style>
:root {
    --primary-color:#333;
    --secondary-color:#666;
    --accent-color:#f0a040;
    --border-color:#ddd;
}

body {
    font-family:'Segoe UI';
    background:#000;
    color:#fff;
}

.header {
    background:#333;
    color:white;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:0;
}

.header-content {
    padding:1rem 2rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-banner {
    margin-top:0;
    width:100%;
}

.top-banner img {
    width:100%;
    height:auto;
    display:block;
}

.oracle-jet-panel {
    height:15px;
    background:url("https://artifacthub-phx.oci.oraclecorp.com/artifactory/acs-ofs-dev-local/oracle-jet-banner.png") repeat-x;
}

.container {
    max-width:960px;
    margin:2rem auto;
    display:flex;
    flex-direction:column;
    gap:1.5rem;
    align-items:center;
    padding:0 1rem;
}

.form-intro {
    text-align:center;
    width:100%;
    max-width:820px;
}

.welcome-title {
    font-size:1.8rem;
    font-weight:700;
    margin:0;
    color:#fff;
}

.subheading {
    margin:0.35rem 0 0;
    color:#ddd;
    font-size:1.1rem;
}

.form-card {
    width:100%;
    max-width:900px;
    background:white;
    padding:2rem;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.form-card h3 {
    margin:0;
    font-size:1.25rem;
    color:var(--primary-color);
}

.form-fields {
    margin-top:1.5rem;
    display:flex;
    flex-direction:column;
    gap:1rem;
}

.form-field {
    display:flex;
    align-items:center;
    gap:1.25rem;
    flex-wrap:wrap;
}

.form-field label {
    min-width:160px;
    font-weight:600;
    font-size:0.95rem;
    color:#444;
    text-align:left;
}

.form-field input {
    flex:1;
    min-width:230px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
    box-sizing:border-box;
}

button {
    width:100%;
    padding:12px;
    background:#333;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.2s ease;
}

button:hover {
    background:#272727;
}

.button-row {
    margin-top:1.5rem;
    width:100%;
    display:flex;
    justify-content:center;
}

.button-row button {
    max-width:320px;
    width:100%;
}

 .excel-preview {
    width:100%;
    max-width:940px;
    background:white;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    padding:1.25rem;
    display:flex;
    flex-direction:column;
    gap:1rem;
}

.preview-header {
    display:flex;
    justify-content:flex-start;
    align-items:center;
    gap:1rem;
    flex-wrap:wrap;
}

.preview-header h3 {
    margin:0;
    font-size:1.15rem;
    color:var(--primary-color);
}

.excel-download {
    border:1px dashed #ddd;
    border-radius:8px;
    padding:1rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    flex-wrap:wrap;
    background:#fafafa;
}

.excel-download p {
    margin:0;
    color:var(--secondary-color);
    flex:1;
    min-width:200px;
}

.download-btn {
    background:none;
    border:1px solid var(--accent-color);
    color:var(--accent-color);
    padding:0.5rem 1rem;
    border-radius:6px;
    font-weight:600;
    text-decoration:none;
    transition:background 0.2s ease, color 0.2s ease;
}

.download-btn:hover {
    background:var(--accent-color);
    color:white;
}

@media (max-width:680px) {
    .form-field {
        flex-direction:column;
        align-items:flex-start;
    }

    .form-field label {
        min-width:0;
    }

    .button-row {
        justify-content:flex-start;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="header-content">
        <h2>SCM Redwood Migration Suite</h2>
    </div>
    <div class="top-banner">
        <img src="__APP_BASE_PATH__/static/images/top-banner.png" alt="SCM Redwood Automation Tool">
    </div>
</div>

<div class="oracle-jet-panel"></div>

<div class="container">

    <div class="form-intro">
        <p class="welcome-title">Welcome to SCM Redwood Migration Suite</p>
        <p class="subheading">Please enter your details below to get started.</p>
    </div>

    <div class="form-card">
        <h3>Enter Details</h3>

        <div class="form-fields">
            <div class="form-field">
                <label for="userName">Your Name</label>
                <input id="userName" placeholder="Enter your name">
            </div>
            <div class="form-field">
                <label for="customerName">Customer Name</label>
                <input id="customerName" placeholder="Enter the customer name">
            </div>
        </div>

        <div class="button-row">
            <button onclick="saveSession()">Continue</button>
        </div>
    </div>

    <div class="excel-preview">
        <div class="preview-header">
            <h3>SCM Redwood Features - 26B</h3>
        </div>
        <div class="excel-download">
            <p>Download/View the excel to explore the latest Redwood Features for SCM</p>
            <a class="download-btn" href="__APP_BASE_PATH__/static/Redwood_SCM_Features_V1.11.xlsx" target="_blank" rel="noreferrer">Download Excel</a>
        </div>
    </div>

</div>

<script>window.REDWOOD_BASE_PATH = "__APP_BASE_PATH__";</script>
<script src="__APP_BASE_PATH__/static/session.js"></script>
<script>
    async function saveSession() {
        const user = document.getElementById("userName").value;
        const customer = document.getElementById("customerName").value;

        if (!user || !customer) {
            alert("Fill all fields");
            return;
        }

        let result;
        try {
            result = await window.sessionHelper.saveSession({
                user,
                customer,
            });
            if (!result?.has_session) {
                throw new Error("Unable to create session");
            }
        } catch (error) {
            alert(error.message || "Session setup failed");
            return;
        }

        alert(`Session created`);
        window.location.href = window.sessionHelper.appUrl("/dashboard");
    }
</script>

</body>
</html>
